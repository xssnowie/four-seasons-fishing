<title>四季钓场</title>

<style>
  /* 游戏字体：站酷快乐体（OFL 授权，见 assets/font/OFL.txt） */
  @font-face { font-family: 'ZCOOL KuaiLe'; src: url('assets/font/ZCOOLKuaiLe.woff2') format('woff2'); font-display: block; }
  html, body { margin: 0; height: 100%; background: #0d1430; overflow: hidden; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  /* 刘海屏：留出安全区 */
  #game { position: fixed; top: env(safe-area-inset-top); right: env(safe-area-inset-right);
          bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left); touch-action: none; }
  /* 账号弹窗 */
  #acct { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 16px;
          background: rgba(10, 14, 30, .55); -webkit-user-select: text; user-select: text; }
  #acct .card { position: relative; width: 100%; max-width: 380px; max-height: 100%; overflow-y: auto; box-sizing: border-box; padding: 26px 24px 18px;
          background: #fff8ea; border: 4px solid #c8923f; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,.4);
          font: 16px/1.5 "MaoKenTangYuan (beta)","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; color: #4a2f17; }
  #acct h2 { margin: 0 0 12px; font-size: 22px; font-family: "ZCOOL KuaiLe","PingFang SC",sans-serif; font-weight: normal; }
  #acct p { margin: 8px 0; }
  #acct .note, #acct .status { font-size: 13px; color: #8a6a4a; }
  #acct .warn { color: #b3261e; font-size: 14px; }
  #acct .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  #acct .tabs button { flex: 1; padding: 8px; border: 2px solid #c8923f; border-radius: 10px; background: #fff; color: #8a6a4a; font: inherit; }
  #acct .tabs button.on { background: #e8a93a; color: #fff; border-color: #e8a93a; font-weight: 600; }
  #acct form { display: flex; flex-direction: column; gap: 10px; }
  #acct input { font-size: 16px; padding: 11px 12px; border: 2px solid #dcc29a; border-radius: 10px; background: #fff; color: #4a2f17; outline: none; }
  #acct input:focus { border-color: #e8a93a; }
  #acct .err { min-height: 1em; color: #b3261e; font-size: 14px; }
  #acct button { cursor: pointer; }
  #acct .go, #acct .sec { width: 100%; padding: 12px; margin-top: 6px; border: 0; border-radius: 12px; font: 600 17px/1.2 inherit; font-family: inherit; }
  #acct .go { background: #e8a93a; color: #fff; }
  #acct .go:disabled { opacity: .6; }
  #acct .sec { background: #fff; color: #8a6a4a; border: 2px solid #dcc29a; }
  #acct .danger.go { background: #b3261e; }
  #acct .link { display: block; margin: 12px auto 0; background: none; border: 0; color: #8a6a4a; font: 14px inherit; font-family: inherit; text-decoration: underline; }
  #acct .link.danger { color: #b3261e; }
  #acct .x { position: absolute; top: 8px; right: 10px; width: 36px; height: 36px; border: 0; background: none; font-size: 20px; color: #8a6a4a; }
</style>
</head>
