<script>
// 搬家：旧网址（GitHub Pages）把这台设备上的游客进度带到新网址；新网址收到后在 store.js 里合并导入
// 2026-11-22 起正式网址是 Cloudflare Pages（同一个 GitHub 仓库自动部署）；只在 github.io 上跳转，不会循环
(function () {
  var NEW_HOME = 'https://four-seasons-fishing.pages.dev/';
  try {
    if (NEW_HOME && /\.github\.io$/.test(location.hostname)) {
      var o = {}, n = 0;
      for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k.indexOf('fishing.') === 0 && k.indexOf('.u.') < 0) { o[k] = localStorage.getItem(k); n++; } } // 账号缓存不带：登录后从云端回来
      window.__moving = true;
      location.replace(NEW_HOME + (n ? '#move=' + encodeURIComponent(JSON.stringify(o)) : ''));
      return;
    }
    var m = location.hash.match(/^#move=(.+)$/);
    if (m) { window.__moved = JSON.parse(decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname + location.search); }
  } catch (e) { /* 搬不了就照常进游戏 */ }
})();
</script>

<script>
  // 手机浏览器会把关掉的页面存成「预览」快照，重新打开时直接显示旧画面：
  // 1) 从快照恢复（bfcache）就重新加载；2) 在后台放了 5 分钟以上再回来，有新版本就重新加载（进度已存，不会丢）
  (function () {
    addEventListener('pageshow', function (e) { if (e.persisted) location.reload(); });
    var hiddenAt = 0, ver = function (html) { var m = /src\/main\.js\?v=(\d+)/.exec(html); return m ? m[1] : ''; };
    var mine = ver(document.documentElement.innerHTML);
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { hiddenAt = Date.now(); return; }
      if (!mine || !hiddenAt || Date.now() - hiddenAt < 5 * 60 * 1000) return;
      fetch('./?nc=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); })
        .then(function (t) { var v = ver(t); if (v && v !== mine) location.reload(); }).catch(function () {});
    });
  })();
</script>
